<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PETSAIGON | Chi tiet san pham</title>
    <script>
        (function () {
            const currentUrl = new URL(window.location.href);
            const normalizedPath = currentUrl.pathname.replace(/\\/g, "/").toLowerCase();
            const isAlreadyInPages = /\/pages\//.test(normalizedPath);

            if (isAlreadyInPages) {
                return;
            }

            const target = `./pages/product-detail.html${window.location.search}${window.location.hash}`;
            const targetUrl = new URL(target, currentUrl.href);
            window.location.replace(targetUrl.toString());
        })();
    </script>
</head>
<body>
    <p>Đang chuyển tới <a href="./pages/product-detail.html">trang chi tiết sản phẩm</a>...</p>
</body>
</html>

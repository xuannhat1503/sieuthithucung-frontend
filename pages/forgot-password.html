<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="../assets/css/petsaigon-layout.css">
</head>
<body class="login-body" data-psg-header-target="site-header" data-psg-header-path="../partials/header.html" data-psg-footer-target="site-footer" data-psg-footer-path="../partials/footer.html">
    <div class="login-page">
        <div id="site-header"></div>
        <main class="login-main">
            <div class="login-shell login-shell--wide">
                <section class="forgot-shell">
                    <h1>Quên mật khẩu</h1>
                    <div class="forgot-card">
                        <form id="forgot-password-form" class="forgot-form" action="#" method="post" data-psg-api-auth="true">
                            <div class="login-field forgot-field">
                                <input id="forgot-email" type="email" name="email" placeholder="Nhập email của bạn" required>
                            </div>
                            <div class="forgot-actions">
                                <button class="login-submit forgot-submit" type="submit">GỬI LIÊN KẾT ĐẶT LẠI MẬT KHẨU</button>
                            </div>
                            <div class="auth-page-link">
                                <a href="./login.html">Quay lại đăng nhập</a>
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </main>
        <div id="site-footer"></div>
    </div>
    <script>
        window.PSG_API_BASE = "http://127.0.0.1:8000/api";
    </script>
    <script src="../assets/js/site.js"></script>
</body>
</html>

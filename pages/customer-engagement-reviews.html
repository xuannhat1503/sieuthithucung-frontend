<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PETSAIGON | Đánh giá sản phẩm đã mua</title>
    <link rel="stylesheet" href="../assets/css/petsaigon-layout.css">
    <link rel="stylesheet" href="../assets/css/engagement/customer-engagement.css">
</head>
<body data-psg-page="customer-engagement-reviews" data-psg-header-target="site-header" data-psg-header-path="../partials/header.html" data-psg-footer-target="site-footer" data-psg-footer-path="../partials/footer.html">
    <div id="site-header"></div>

    <main class="ec-page">
        <section class="container ec-page-shell">
            <div class="ec-page-head">
                <span class="ec-chip">Đánh giá & bình luận</span>
                <h1>Đánh giá sản phẩm đã mua</h1>
                <p>Chỉ những sản phẩm nằm trong đơn hàng đã hoàn thành mới hiện tại đây để khách hàng đánh giá.</p>
            </div>

            <div id="status" class="ec-alert ec-hidden"></div>
        </section>

        <section class="container ec-section">
            <div id="review-products" class="ec-purchase-stack"></div>
        </section>
    </main>

    <div id="site-footer"></div>

    <div id="login-modal" class="ec-modal" aria-hidden="true">
        <div class="ec-modal-backdrop" data-login-close></div>
        <div class="ec-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="login-modal-title">
            <button type="button" class="ec-modal-close" data-login-close aria-label="Đóng">x</button>
            <span class="ec-kicker">Đăng nhập</span>
            <h3 id="login-modal-title">Đăng nhập để tiếp tục</h3>
            <p id="login-modal-message">Vui lòng đăng nhập trước khi gửi đánh giá.</p>

            <form id="login-form" class="ec-form-stack">
                <label>Email
                    <input type="email" name="email" placeholder="Nhập email tài khoản" required>
                </label>
                <label>Mật khẩu
                    <input type="password" name="password" placeholder="Nhập mật khẩu" required>
                </label>
                <button type="submit" class="ec-btn ec-btn-primary ec-btn-full">Đăng nhập</button>
            </form>

            <div id="login-status" class="ec-alert ec-alert-info ec-modal-status">Nhập tài khoản để bắt đầu.</div>
        </div>
    </div>

    <script src="../assets/js/site.js"></script>
    <script src="../assets/js/engagement/common.js"></script>
    <script src="../assets/js/engagement/customer-engagement-reviews.js"></script>
</body>
</html>

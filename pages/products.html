<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PETSAIGON | Danh sách sản phẩm</title>
    <meta name="description" content="Danh sách sản phẩm có tìm kiếm, bộ lọc và phân trang dùng chung API catalog của PETSAIGON.">
    <link rel="stylesheet" href="../assets/css/petsaigon-layout.css">
</head>
<body data-psg-page="products" data-psg-header-target="site-header" data-psg-header-path="../partials/header.html" data-psg-footer-target="site-footer" data-psg-footer-path="../partials/footer.html">
    <div id="site-header"></div>

    <main>
        <section class="psg-page-hero">
            <div class="psg-shell">
                <p class="psg-breadcrumb">Trang chủ / Sản phẩm</p>
                <h1>Danh sách sản phẩm</h1>
                <p>Trang này đã được nối với API catalog để tìm kiếm, lọc và mở chi tiết sản phẩm trực tiếp từ hệ backend hiện tại.</p>
            </div>
        </section>

        <section class="psg-section psg-shell psg-catalog-layout">
            <form class="psg-filter-panel" id="catalog-filters">
                <div class="psg-filter-box">
                    <h2>Tìm kiếm</h2>
                    <label class="psg-form-label" for="catalog-search">Từ khóa</label>
                    <input id="catalog-search" class="psg-field-input" name="keyword" type="search" placeholder="VD: pate, cát vệ sinh...">
                </div>

                <div class="psg-filter-box">
                    <h2>Danh mục</h2>
                    <div data-category-options></div>
                </div>

                <div class="psg-filter-box">
                    <h2>Mức giá</h2>
                    <label class="psg-form-label" for="min-price">Giá từ</label>
                    <input id="min-price" class="psg-field-input" name="min_price" type="number" min="0" step="1000" placeholder="0">
                    <label class="psg-form-label psg-spaced-label" for="max-price">Đến giá</label>
                    <input id="max-price" class="psg-field-input" name="max_price" type="number" min="0" step="1000" placeholder="1000000">
                </div>

                <div class="psg-filter-box">
                    <h2>Sắp xếp</h2>
                    <select class="psg-field-input" name="sort">
                        <option value="latest">Mới nhất</option>
                        <option value="price_asc">Giá thấp đến cao</option>
                        <option value="price_desc">Giá cao đến thấp</option>
                        <option value="name_asc">Tên A-Z</option>
                        <option value="rating">Đánh giá cao</option>
                    </select>
                </div>

                <button class="psg-btn psg-btn-primary" type="submit">Áp dụng bộ lọc</button>
            </form>

            <div class="psg-catalog-main">
                <div class="psg-catalog-toolbar">
                    <p data-results-summary><strong>Đang tải dữ liệu...</strong></p>
                    <p class="psg-toolbar-hint">Dữ liệu được ưu tiên lấy từ API, có phương án dự phòng để trang không bị trống.</p>
                </div>

                <div class="psg-product-grid" data-product-list="catalog"></div>

                <nav class="psg-pagination" data-pagination></nav>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="../assets/js/site.js"></script>
    <script src="../assets/js/storefront.js"></script>
</body>
</html>

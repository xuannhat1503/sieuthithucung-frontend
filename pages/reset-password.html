<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet" href="../assets/css/petsaigon-layout.css">
</head>
<body class="login-body" data-psg-header-target="site-header" data-psg-header-path="../partials/header.html" data-psg-footer-target="site-footer" data-psg-footer-path="../partials/footer.html">
    <div class="login-page">
        <div id="site-header"></div>
        <main class="login-main">
            <div class="login-shell login-shell--wide">
                <section class="forgot-shell reset-shell">
                    <h1>Đặt lại mật khẩu</h1>
                    <div class="forgot-card reset-card">
                        <form id="reset-password-form" class="forgot-form reset-form" action="#" method="post" data-psg-api-auth="true">
                            <input type="hidden" name="token" value="">
                            <div class="login-field forgot-field">
                                <input id="reset-email" type="email" name="email" placeholder="Nhập email của bạn" required>
                            </div>
                            <div class="login-field forgot-field">
                                <input id="reset-password" type="password" name="password" placeholder="Mật khẩu mới" required>
                            </div>
                            <div class="login-field forgot-field">
                                <input id="reset-password-confirmation" type="password" name="password_confirmation" placeholder="Xác nhận mật khẩu mới" required>
                            </div>
                            <div class="forgot-actions">
                                <button class="login-submit forgot-submit reset-submit" type="submit">ĐẶT LẠI MẬT KHẨU</button>
                            </div>
                            <div class="auth-page-link">
                                <a href="./login.html">Quay lại đăng nhập</a>
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </main>
        <div id="site-footer"></div>
    </div>
    <script src="../assets/js/site.js"></script>
</body>
</html>
